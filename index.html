<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Interactividad de Elasticidad de la Demanda</title>
  <!-- Incluir Plotly desde CDN -->
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .slider-container {
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
    }
    input[type="range"] {
      width: 300px;
    }
    #plot {
      width: 600px;
      height: 400px;
      margin-bottom: 15px;
    }
    .result, .calc-details {
      margin-top: 15px;
      padding: 10px;
      border: 1px solid #ccc;
      max-width: 600px;
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <h2>Interactividad de Elasticidad de la Demanda</h2>
  <p>Función de demanda: Q = a - bY</p>
  
  <!-- Controles -->
  <div class="slider-container">
    <label for="aInput">Intercepto (a): </label>
    <input type="range" id="aInput" min="50" max="200" step="5" value="100">
    <span id="aVal">100</span>
  </div>
  
  <div class="slider-container">
    <label for="bInput">Pendiente (b): </label>
    <input type="range" id="bInput" min="0.1" max="5" step="0.1" value="1">
    <span id="bVal">1.0</span>
  </div>
  
  <div class="slider-container">
    <label for="yInput">Precio (Y): </label>
    <input type="range" id="yInput" min="0" max="500" step="1" value="20">
    <span id="yVal">20</span>
  </div>
  
  <!-- Div para la gráfica -->
  <div id="plot"></div>
  
  <!-- Resultados -->
  <div class="result" id="resultText"></div>
  <div class="calc-details" id="calcDetails"></div>
  
  <script>
    function updatePlot() {
      // Obtener valores de los controles
      var a = parseFloat(document.getElementById("aInput").value);
      var b = parseFloat(document.getElementById("bInput").value);
      var Y = parseFloat(document.getElementById("yInput").value);
      document.getElementById("aVal").textContent = a;
      document.getElementById("bVal").textContent = b.toFixed(1);
      document.getElementById("yVal").textContent = Y;
      
      // Calcular cantidad: Q = a - bY
      var Q = a - b * Y;
      // Calcular elasticidad: E = -b*(Y/Q)
      var elasticity = (Q === 0) ? NaN : -b * (Y / Q);
      
      // Crear puntos para la curva de demanda
      var numPoints = 100;
      var Y_vals = [], Q_vals = [];
      var Y_min = 0, Y_max = 500;
      for (var i = 0; i <= numPoints; i++) {
        var currentY = Y_min + i * (Y_max - Y_min) / numPoints;
        Y_vals.push(currentY);
        Q_vals.push(a - b * currentY);
      }
      
      var traceCurve = {
        x: Y_vals,
        y: Q_vals,
        mode: 'lines',
        name: 'Curva de Demanda',
        line: {color: 'blue'}
      };
      
      var tracePoint = {
        x: [Y],
        y: [Q],
        mode: 'markers',
        name: 'Punto Evaluado',
        marker: { color: 'red', size: 10 }
      };
      
      var data = [traceCurve, tracePoint];
      
      // Layout sin utilizar LaTeX en los ejes (etiquetas en texto plano)
      var layout = {
        title: 'Curva de Demanda',
        xaxis: {
          title: 'Precio (Y)',
          range: [0, 500],
          dtick: 50
        },
        yaxis: {
          title: 'Cantidad (Q)',
          range: [-500, 500],
          dtick: 100
        },
        margin: { t: 50, b: 50, l: 50, r: 20 }
      };
      
      Plotly.newPlot('plot', data, layout);
      
      // Mostrar resultados de elasticidad
      var resultMessage = "<strong>Elasticidad en Y = " + Y.toFixed(2) + ":</strong> ";
      if (isNaN(elasticity)) {
        resultMessage += "No se puede calcular la elasticidad (Q = 0).";
      } else {
        resultMessage += elasticity.toFixed(2) + "<br>";
        if (Math.abs(elasticity) < 1) {
          resultMessage += "La demanda es inelástica en este punto.";
        } else if (Math.abs(elasticity) > 1) {
          resultMessage += "La demanda es elástica en este punto.";
        } else {
          resultMessage += "La demanda es unitaria en este punto.";
        }
      }
      document.getElementById("resultText").innerHTML = resultMessage;
      
      // Mostrar detalles de los cálculos
      var details = "<h3>Detalles del Cálculo</h3>";
      details += "<p><strong>Función de Demanda:</strong> Q = a - bY</p>";
      details += "<p><strong>Valores:</strong> a = " + a + ", b = " + b.toFixed(1) + ", Y = " + Y + "</p>";
      details += "<p><strong>Cálculo de Q:</strong> Q = " + a + " - (" + b.toFixed(1) + " × " + Y + ") = " + Q.toFixed(2) + "</p>";
      if (Q === 0) {
        details += "<p><strong>Nota:</strong> Q = 0, por lo que no se puede calcular la elasticidad.</p>";
      } else {
        details += "<p><strong>Cálculo de la Elasticidad:</strong> E = -b × (Y / Q)</p>";
        details += "<p>E = -" + b.toFixed(1) + " × (" + Y + " / " + Q.toFixed(2) + ") = " + elasticity.toFixed(2) + "</p>";
      }
      document.getElementById("calcDetails").innerHTML = details;
    }
    
    document.getElementById("aInput").addEventListener("input", updatePlot);
    document.getElementById("bInput").addEventListener("input", updatePlot);
    document.getElementById("yInput").addEventListener("input", updatePlot);
    
    updatePlot();
  </script>
</body>
</html>
