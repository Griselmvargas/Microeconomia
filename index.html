<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Interactividad de Elasticidad de la Demanda</title>
  <!-- Incluir Plotly desde CDN -->
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .slider-container, .input-container {
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
    }
    input[type="range"],
    input[type="text"] {
      width: 300px;
      margin-right: 10px;
    }
    #plot {
      width: 600px;
      height: 400px;
      margin-bottom: 15px;
    }
    .result, .calc-details {
      margin-top: 15px;
      padding: 10px;
      border: 1px solid #ccc;
      max-width: 600px;
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <h2>Interactividad de Elasticidad de la Demanda</h2>
  <p>La función de demanda se expresará en la forma <strong>Q = [ecuación]</strong>. Ingresa la ecuación a continuación (usa \(a\) para el intercepto, \(b\) para la pendiente y \(Y\) para el precio).<br>
  Ejemplo: <em>a - b*Y</em></p>
  
  <!-- Cuadro de texto para la ecuación -->
  <div class="input-container">
    <label for="eqInput">Ecuación de Demanda:</label>
    <input type="text" id="eqInput" value="a - b*Y">
  </div>
  
  <!-- Controles para parámetros -->
  <div class="slider-container">
    <label for="aInput">Intercepto (a): </label>
    <input type="range" id="aInput" min="50" max="200" step="5" value="100">
    <span id="aVal">100</span>
  </div>
  
  <div class="slider-container">
    <label for="bInput">Pendiente (b): </label>
    <input type="range" id="bInput" min="0.1" max="5" step="0.1" value="1">
    <span id="bVal">1.0</span>
  </div>
  
  <div class="slider-container">
    <label for="yInput">Precio (Y): </label>
    <input type="range" id="yInput" min="0" max="500" step="1" value="20">
    <span id="yVal">20</span>
  </div>
  
  <!-- Div para la gráfica -->
  <div id="plot"></div>
  
  <!-- Resultados y Detalles -->
  <div class="result" id="resultText"></div>
  <div class="calc-details" id="calcDetails"></div>
  
  <script>
    function updatePlot() {
      // Obtener los valores de los controles
      var a = parseFloat(document.getElementById("aInput").value);
      var b = parseFloat(document.getElementById("bInput").value);
      var Y = parseFloat(document.getElementById("yInput").value);
      var eqString = document.getElementById("eqInput").value;
      
      // Actualizar las etiquetas de los sliders
      document.getElementById("aVal").textContent = a;
      document.getElementById("bVal").textContent = b.toFixed(1);
      document.getElementById("yVal").textContent = Y;
      
      // Evaluar la ecuación de demanda
      var Q, eqError = "";
      try {
        // Se crea una función anónima con variables a, b y Y
        var demandFunc = new Function("a", "b", "Y", "return " + eqString + ";");
        Q = demandFunc(a, b, Y);
      } catch (error) {
        Q = NaN;
        eqError = "Error en la ecuación: " + error.message;
      }
      
      // Calcular la elasticidad: E = -b * (Y / Q)
      var elasticity = (Q === 0 || isNaN(Q)) ? NaN : -b * (Y / Q);
      
      // Generar puntos para la curva de demanda para Y de 0 a 500
      var numPoints = 100;
      var Y_vals = [], Q_vals = [];
      var Y_min = 0, Y_max = 500;
      for (var i = 0; i <= numPoints; i++) {
        var currentY = Y_min + i * (Y_max - Y_min) / numPoints;
        Y_vals.push(currentY);
        // Evaluar la ecuación para cada Y; si hay error, usar NaN
        try {
          Q_vals.push(demandFunc(a, b, currentY));
        } catch (e) {
          Q_vals.push(NaN);
        }
      }
      
      // Definir trazos para la gráfica
      var traceCurve = {
        x: Y_vals,
        y: Q_vals,
        mode: 'lines',
        name: 'Curva de Demanda',
        line: {color: 'blue'}
      };
      
      var tracePoint = {
        x: [Y],
        y: [Q],
        mode: 'markers',
        name: 'Punto Evaluado',
        marker: { color: 'red', size: 10 }
      };
      
      var data = [traceCurve, tracePoint];
      
      var layout = {
        title: 'Curva de Demanda',
        xaxis: {
          title: 'Precio (Y)',
          range: [0, 500],
          dtick: 50
        },
        yaxis: {
          title: 'Cantidad (Q)',
          range: [-500, 500],
          dtick: 100
        },
        margin: { t: 50, b: 50, l: 50, r: 20 }
      };
      
      Plotly.newPlot('plot', data, layout);
      
      // Mostrar resultados de elasticidad
      var resultMessage = "<strong>Elasticidad en Y = " + Y.toFixed(2) + ":</strong> ";
      if (isNaN(elasticity)) {
        resultMessage += "No se puede calcular la elasticidad.";
      } else {
        resultMessage += elasticity.toFixed(2) + "<br>";
        if (Math.abs(elasticity) < 1) {
          resultMessage += "La demanda es inelástica en este punto.";
        } else if (Math.abs(elasticity) > 1) {
          resultMessage += "La demanda es elástica en este punto.";
        } else {
          resultMessage += "La demanda es unitaria en este punto.";
        }
      }
      document.getElementById("resultText").innerHTML = resultMessage;
      
      // Mostrar detalles de los cálculos
      var details = "<h3>Detalles del Cálculo</h3>";
      details += "<p><strong>Función de Demanda ingresada:</strong> Q = " + eqString + "</p>";
      details += "<p><strong>Valores:</strong> a = " + a + ", b = " + b.toFixed(1) + ", Y = " + Y + "</p>";
      if(eqError) {
        details += "<p style='color:red;'><strong>Error:</strong> " + eqError + "</p>";
      } else {
        details += "<p><strong>Cálculo de Q:</strong> Q = " + eqString + " = " + Q.toFixed(2) + "</p>";
        if (isNaN(Q) || Q === 0) {
          details += "<p><strong>Nota:</strong> Q es " + (isNaN(Q) ? "NaN" : "0") + ", no se puede calcular la elasticidad.</p>";
        } else {
          details += "<p><strong>Cálculo de la Elasticidad:</strong> E = -b × (Y / Q)</p>";
          details += "<p>E = -" + b.toFixed(1) + " × (" + Y + " / " + Q.toFixed(2) + ") = " + elasticity.toFixed(2) + "</p>";
        }
      }
      
      document.getElementById("calcDetails").innerHTML = details;
    }
    
    // Asignar event listeners a los controles y al cuadro de texto de ecuación
    document.getElementById("aInput").addEventListener("input", updatePlot);
    document.getElementById("bInput").addEventListener("input", updatePlot);
    document.getElementById("yInput").addEventListener("input", updatePlot);
    document.getElementById("eqInput").addEventListener("input", updatePlot);
    
    // Actualizar inicialmente
    updatePlot();
  </script>
</body>
</html>
