<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Interactividad de Elasticidad de la Demanda</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .slider-container {
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
    }
    input[type="range"] {
      width: 300px;
    }
    #graphCanvas {
      border: 1px solid #ccc;
      display: block;
      margin-bottom: 15px;
    }
    .result, .calc-details {
      margin-top: 15px;
      padding: 10px;
      border: 1px solid #ccc;
      max-width: 600px;
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <h2>Interactividad de Elasticidad de la Demanda</h2>
  <p>Función de demanda: <em>Q = a - bY</em></p>
  
  <!-- Controles -->
  <div class="slider-container">
    <label for="aInput">Intercepto (a): </label>
    <input type="range" id="aInput" min="50" max="200" step="5" value="100">
    <span id="aVal">100</span>
  </div>
  
  <div class="slider-container">
    <label for="bInput">Pendiente (b): </label>
    <input type="range" id="bInput" min="0.1" max="5" step="0.1" value="1">
    <span id="bVal">1.0</span>
  </div>
  
  <div class="slider-container">
    <label for="yInput">Precio (Y): </label>
    <input type="range" id="yInput" min="0" max="500" step="1" value="20">
    <span id="yVal">20</span>
  </div>
  
  <!-- Canvas para el gráfico -->
  <canvas id="graphCanvas" width="600" height="400"></canvas>
  
  <!-- Resultados -->
  <div class="result" id="resultText"></div>
  <div class="calc-details" id="calcDetails"></div>
  
  <script>
    function updateGraph() {
      // Obtener valores de los controles
      var a = parseFloat(document.getElementById("aInput").value);
      var b = parseFloat(document.getElementById("bInput").value);
      var Y = parseFloat(document.getElementById("yInput").value);
      
      // Actualizar las etiquetas de los sliders
      document.getElementById("aVal").textContent = a;
      document.getElementById("bVal").textContent = b.toFixed(1);
      document.getElementById("yVal").textContent = Y;
      
      // Calcular Q con: Q = a - bY
      var Q = a - b * Y;
      
      // Calcular elasticidad: E = -b * (Y / Q)
      var elasticity = (Q === 0) ? NaN : -b * (Y / Q);
      
      // Configuración de la zona de dibujo
      var canvas = document.getElementById("graphCanvas");
      var ctx = canvas.getContext("2d");
      // Limpiar el canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Definir escalas y offsets:
      // Eje X: Y de 0 a 500 → canvas.width = 600 → escalaX = 600/500
      var escalaX = canvas.width / 500; // 600/500 = 1.2
      // Eje Y: Q de -500 a 500 → 1000 unidades totales → canvas.height = 400 → escalaY = 400/1000
      var escalaY = canvas.height / 1000; // 0.4
      // El centro vertical en canvas corresponde a Q = 0:
      var offsetY = canvas.height / 2;
      
      // Dibujar eje de precio (Y)
      ctx.beginPath();
      ctx.moveTo(0, offsetY);
      ctx.lineTo(canvas.width, offsetY);
      ctx.strokeStyle = "black";
      ctx.stroke();
      
      // Dibujar eje de cantidad (Q)
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, canvas.height);
      ctx.strokeStyle = "black";
      ctx.stroke();
      
      // Opcional: Dibujar líneas de la cuadrícula
      ctx.strokeStyle = "#ccc";
      // Líneas verticales (cada 50 unidades en Y)
      for (var yVal = 0; yVal <= 500; yVal += 50) {
        ctx.beginPath();
        ctx.moveTo(yVal * escalaX, 0);
        ctx.lineTo(yVal * escalaX, canvas.height);
        ctx.stroke();
      }
      // Líneas horizontales (cada 100 unidades en Q, desde -500 hasta 500)
      for (var qVal = -500; qVal <= 500; qVal += 100) {
        var yCanvas = offsetY - qVal * escalaY;
        ctx.beginPath();
        ctx.moveTo(0, yCanvas);
        ctx.lineTo(canvas.width, yCanvas);
        ctx.stroke();
      }
      
      // Dibujar la curva de la demanda para Y de 0 a 500
      ctx.strokeStyle = "blue";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (var yVal = 0; yVal <= 500; yVal += 1) {
        var qVal = a - b * yVal;
        var xC = yVal * escalaX;             // Coordenada en X basada en Y
        var yC = offsetY - qVal * escalaY;     // Coordenada en Y (invertida)
        if (yVal === 0) {
          ctx.moveTo(xC, yC);
        } else {
          ctx.lineTo(xC, yC);
        }
      }
      ctx.stroke();
      
      // Dibujar el punto evaluado (Y, Q)
      ctx.fillStyle = "red";
      var ptX = Y * escalaX;
      var ptY = offsetY - Q * escalaY;
      ctx.beginPath();
      ctx.arc(ptX, ptY, 5, 0, 2 * Math.PI);
      ctx.fill();
      
      // Mostrar resultados de elasticidad
      var resultText = "<strong>Elasticidad en Y = " + Y.toFixed(2) + ":</strong> ";
      if (isNaN(elasticity)) {
        resultText += "No se puede determinar la elasticidad (Q = 0).";
      } else {
        resultText += elasticity.toFixed(2) + "<br>";
        if (Math.abs(elasticity) < 1) {
          resultText += "La demanda es <strong>inelástica</strong> en este punto.";
        } else if (Math.abs(elasticity) > 1) {
          resultText += "La demanda es <strong>elástica</strong> en este punto.";
        } else {
          resultText += "La demanda es <strong>unitaria</strong> en este punto.";
        }
      }
      document.getElementById("resultText").innerHTML = resultText;
      
      // Mostrar detalles de los cálculos
      var details = "<h3>Detalles del Cálculo</h3>";
      details += "<p><strong>1.</strong> Función de demanda: Q = a - bY</p>";
      details += "<p><strong>2.</strong> Valores: a = " + a + ", b = " + b.toFixed(1) + ", Y = " + Y + "</p>";
      details += "<p><strong>3.</strong> Calculamos Q: Q = " + a + " - (" + b.toFixed(1) + " * " + Y + ") = " + Q.toFixed(2) + "</p>";
      if (Q === 0) {
        details += "<p><strong>4.</strong> Q = 0, por lo que no se puede calcular la elasticidad (división por cero).</p>";
      } else {
        details += "<p><strong>4.</strong> Elasticidad: E = -b * (Y / Q)</p>";
        details += "<p>E = -" + b.toFixed(1) + " * (" + Y + " / " + Q.toFixed(2) + ") = " + elasticity.toFixed(2) + "</p>";
      }
      document.getElementById("calcDetails").innerHTML = details;
    }
    
    // Asignar event listeners a los sliders
    document.getElementById("aInput").addEventListener("input", updateGraph);
    document.getElementById("bInput").addEventListener("input", updateGraph);
    document.getElementById("yInput").addEventListener("input", updateGraph);
    
    // Dibujo inicial
    updateGraph();
  </script>
</body>
</html>
